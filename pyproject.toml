[project]
name = "imc-prosperity-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arch>=8.0.0",
    "blinker==1.9.0",
    "chart-studio==1.1.0",
    "dash==4.1.0",
    "jsonpickle>=4.1.1",
    "matplotlib>=3.10.8",
    "narwhals==2.18.1",
    "nest-asyncio==1.6.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "plotly==6.6.0",
    "prosperity4btest>=0.4.2",
    "requests==2.33.1",
    "scipy>=1.17.1",
    "statistics>=1.0.3.5",
    "statsmodels>=0.14.6",
    "typing>=3.10.0.0",
]

[tool.uv.workspace]
members = [
    "log_visualiser",
    "montecarlo_backtester/imc-prosperity-4/backtester",
]

[tool.uv.sources]
prosperity4mcbt = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "prosperity4mcbt",
]
